# pytest do backend. Rodar da raiz: bash scripts/test_backend.sh
# (ou: python -m pytest backend/tests). Sempre no PostgreSQL agro_mro_test.
[pytest]
testpaths = tests
# backend/ (pacote app) e a raiz do repositório (tools.db_parity).
pythonpath = . ..
addopts = -ra --strict-markers --strict-config -p no:cacheprovider
xfail_strict = true
filterwarnings =
    error
